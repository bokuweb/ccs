name: Signed macOS release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
  MACOSX_DEPLOYMENT_TARGET: '15.0'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Check release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Select app for release tag
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" =~ ^mini-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'APP_NAME=ccs-mini' >> "$GITHUB_ENV"
            echo 'BUILD_SCRIPT=build-mini.sh' >> "$GITHUB_ENV"
          elif [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'APP_NAME=ccs' >> "$GITHUB_ENV"
            echo 'BUILD_SCRIPT=build.sh' >> "$GITHUB_ENV"
          else
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE_P12_BASE64"
          test -n "$CERTIFICATE_PASSWORD"
          certificate="$RUNNER_TEMP/ccs-certificate.p12"
          keychain="$RUNNER_TEMP/ccs-signing.keychain-db"
          keychain_password="$(uuidgen)"
          trap 'rm -f "$certificate"' EXIT
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F 'Developer ID Application: Satoshi Ueki (66U862VS9W)'

      - name: Build and sign
        env:
          CCS_CODESIGN_IDENTITY: 'Developer ID Application: Satoshi Ueki (66U862VS9W)'
          CCS_OUTPUT_DIR: ${{ runner.temp }}/ccs-release
        run: |
          set -euo pipefail
          "./$BUILD_SCRIPT"
          minos=$(otool -l "$CCS_OUTPUT_DIR/$APP_NAME.app/Contents/MacOS/$APP_NAME" | awk '/cmd LC_BUILD_VERSION/ { in_build = 1 } in_build && $1 == "minos" { print $2; exit }')
          echo "Built minimum macOS: ${minos:-missing}; expected: $MACOSX_DEPLOYMENT_TARGET"
          test "$minos" = "$MACOSX_DEPLOYMENT_TARGET"
          codesign --verify --strict --deep --verbose=2 "$CCS_OUTPUT_DIR/$APP_NAME.app"

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          TEAM_ID: 66U862VS9W
          CCS_OUTPUT_DIR: ${{ runner.temp }}/ccs-release
        run: |
          set -euo pipefail
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          xcrun notarytool submit "$CCS_OUTPUT_DIR/$APP_NAME.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait --output-format json > "$RUNNER_TEMP/app-notary.json"
          jq -e '.status == "Accepted"' "$RUNNER_TEMP/app-notary.json"
          xcrun stapler staple "$CCS_OUTPUT_DIR/$APP_NAME.app"
          xcrun stapler validate "$CCS_OUTPUT_DIR/$APP_NAME.app"
          ditto -c -k --sequesterRsrc --keepParent "$CCS_OUTPUT_DIR/$APP_NAME.app" "$CCS_OUTPUT_DIR/$APP_NAME.zip"
          spctl --assess --type execute --verbose "$CCS_OUTPUT_DIR/$APP_NAME.app"
          hdiutil create -volname "$APP_NAME" -srcfolder "$CCS_OUTPUT_DIR/$APP_NAME.app" \
            -format UDZO "$CCS_OUTPUT_DIR/$APP_NAME.dmg"
          xcrun notarytool submit "$CCS_OUTPUT_DIR/$APP_NAME.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait --output-format json > "$RUNNER_TEMP/dmg-notary.json"
          jq -e '.status == "Accepted"' "$RUNNER_TEMP/dmg-notary.json"
          xcrun stapler staple "$CCS_OUTPUT_DIR/$APP_NAME.dmg"
          xcrun stapler validate "$CCS_OUTPUT_DIR/$APP_NAME.dmg"
          (cd "$CCS_OUTPUT_DIR" && shasum -a 256 "$APP_NAME.zip" "$APP_NAME.dmg" > SHA256SUMS)

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          CCS_OUTPUT_DIR: ${{ runner.temp }}/ccs-release
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "$CCS_OUTPUT_DIR/$APP_NAME.zip" \
            "$CCS_OUTPUT_DIR/$APP_NAME.dmg" \
            "$CCS_OUTPUT_DIR/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload signed release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.RELEASE_TAG }}-macos
          path: |
            ${{ runner.temp }}/ccs-release/${{ env.APP_NAME }}.zip
            ${{ runner.temp }}/ccs-release/${{ env.APP_NAME }}.dmg
            ${{ runner.temp }}/ccs-release/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

      - name: Remove temporary signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/ccs-signing.keychain-db" || true
