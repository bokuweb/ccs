name: Signed macOS release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE_P12_BASE64"
          test -n "$CERTIFICATE_PASSWORD"
          certificate="$RUNNER_TEMP/ccs-certificate.p12"
          keychain="$RUNNER_TEMP/ccs-signing.keychain-db"
          keychain_password="$(uuidgen)"
          trap 'rm -f "$certificate"' EXIT
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F 'Developer ID Application: Satoshi Ueki (66U862VS9W)'

      - name: Build and sign
        env:
          CCS_CODESIGN_IDENTITY: 'Developer ID Application: Satoshi Ueki (66U862VS9W)'
          CCS_OUTPUT_DIR: ${{ runner.temp }}/ccs-release
        run: |
          ./build.sh
          codesign --verify --strict --deep --verbose=2 "$CCS_OUTPUT_DIR/ccs.app"

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          TEAM_ID: 66U862VS9W
          CCS_OUTPUT_DIR: ${{ runner.temp }}/ccs-release
        run: |
          set -euo pipefail
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          xcrun notarytool submit "$CCS_OUTPUT_DIR/ccs.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait
          xcrun stapler staple "$CCS_OUTPUT_DIR/ccs.app"
          xcrun stapler validate "$CCS_OUTPUT_DIR/ccs.app"
          ditto -c -k --sequesterRsrc --keepParent "$CCS_OUTPUT_DIR/ccs.app" "$CCS_OUTPUT_DIR/ccs.zip"
          spctl --assess --type execute --verbose "$CCS_OUTPUT_DIR/ccs.app"

      - name: Upload signed release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccs-${{ github.event.release.tag_name }}-macos
          path: ${{ runner.temp }}/ccs-release/ccs.zip
          if-no-files-found: error
          retention-days: 90
